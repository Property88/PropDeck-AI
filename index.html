<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PropDeck AI - Property Marketing</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#101828;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =====================================================
   HEADER
===================================================== */

header{
    height:82px;
    background:#ffffff;
    border-bottom:1px solid #e4e7ec;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    position:sticky;
    top:0;
    z-index:1000;
}

.header-logo{
    height:56px;
    width:auto;
    max-width:220px;

    display:block;

    object-fit:contain;
    object-position:left center;
}

.header-badge{
    border:1px solid #9fc3e8;
    color:#075a9c;
    background:#eef7ff;

    padding:9px 14px;

    border-radius:9px;

    font-size:13px;
    font-weight:600;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:min(
        1500px,
        calc(100% - 40px)
    );

    margin:28px auto 60px;
}

.page-heading{
    margin-bottom:20px;
}

.page-heading h1{
    margin:0 0 8px;

    font-size:
        clamp(25px,3vw,34px);

    color:#101828;
}

.page-heading p{
    margin:0;

    color:#667085;

    font-size:14px;
}


/* =====================================================
   MAIN GRID
===================================================== */

.main-grid{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        380px;

    gap:20px;

    align-items:start;
}

.left-column,
.right-column{
    min-width:0;
}


/* =====================================================
   CARD
===================================================== */

.card{
    background:#ffffff;

    border:1px solid #e4e7ec;

    border-radius:16px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:
        0 3px 14px
        rgba(16,24,40,.04);
}

.card-title{
    margin:0 0 18px;

    font-size:18px;

    color:#101828;
}

.card-subtitle{
    margin:-10px 0 18px;

    color:#667085;

    font-size:12px;
}


/* =====================================================
   FORM
===================================================== */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:15px;
}

.field{
    min-width:0;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    display:block;

    margin-bottom:7px;

    font-size:12px;

    font-weight:700;

    color:#344054;
}

.field input,
.field select,
.field textarea{
    width:100%;

    border:
        1px solid #d0d5dd;

    border-radius:9px;

    background:#ffffff;

    color:#101828;

    outline:none;

    padding:11px 12px;

    font-size:13px;

    transition:
        border-color .2s,
        box-shadow .2s;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#1769aa;

    box-shadow:
        0 0 0 3px
        rgba(23,105,170,.10);
}

.field textarea{
    min-height:105px;

    resize:vertical;
}


/* =====================================================
   PHOTO UPLOAD
===================================================== */

.photo-upload{
    border:
        1px dashed #b8c1cc;

    border-radius:12px;

    padding:16px;

    background:#fafbfc;
}

.photo-upload input{
    width:100%;
}

.photo-gallery{
    display:grid;

    grid-template-columns:
        repeat(6,minmax(0,1fr));

    gap:10px;

    margin-top:14px;
}

.photo-item{
    position:relative;

    aspect-ratio:1/1;

    overflow:hidden;

    border-radius:10px;

    background:#eef2f6;

    border:
        1px solid #e4e7ec;
}

.photo-item img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.photo-remove{
    position:absolute;

    top:5px;
    right:5px;

    width:25px;
    height:25px;

    border:0;

    border-radius:50%;

    background:#ffffff;

    color:#d92d20;

    font-weight:bold;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.15);
}


/* =====================================================
   BRANDING
===================================================== */

.branding-box{
    display:grid;

    grid-template-columns:
        150px
        minmax(0,1fr);

    gap:18px;

    align-items:start;
}

.logo-preview{
    height:120px;

    border:
        1px solid #e4e7ec;

    border-radius:12px;

    background:#ffffff;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:12px;

    overflow:hidden;
}

.logo-preview img{
    max-width:100%;
    max-height:100%;

    object-fit:contain;
}

.brand-fields{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:12px;
}

.brand-fields .full{
    grid-column:1/-1;
}


/* =====================================================
   BUTTONS
===================================================== */

.action-row{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:18px;
}

.btn{
    border:0;

    border-radius:10px;

    padding:11px 17px;

    font-size:13px;

    font-weight:700;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    min-height:42px;

    transition:
        transform .15s,
        opacity .15s,
        box-shadow .15s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn:active{
    transform:scale(.98);
}

.btn-primary{
    background:#101828;
    color:#ffffff;
}

.btn-secondary{
    background:#eef2f6;
    color:#101828;
}

.btn-canva{
    background:#7c3aed;
    color:#ffffff;
}


/* =====================================================
   PROPERTY PREVIEW
===================================================== */

.property-preview{
    background:
        linear-gradient(
            145deg,
            #0b1735,
            #111d3d
        );

    color:#ffffff;

    border-radius:16px;

    padding:24px;

    min-height:420px;

    overflow:hidden;
}

.preview-brand{
    font-size:10px;

    letter-spacing:3px;

    opacity:.7;

    margin-bottom:12px;
}

.preview-title{
    font-size:28px;

    font-weight:800;

    line-height:1.15;

    margin-bottom:9px;

    word-break:break-word;
}

.preview-location{
    font-size:14px;

    opacity:.9;

    margin-bottom:8px;

    word-break:break-word;
}

.preview-price{
    font-size:30px;

    font-weight:800;

    margin-bottom:15px;

    word-break:break-word;
}

.preview-pills{
    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-bottom:18px;
}

.preview-pills span{
    border:
        1px solid
        rgba(255,255,255,.35);

    border-radius:20px;

    padding:6px 9px;

    font-size:11px;
}

.preview-description{
    font-size:13px;

    line-height:1.6;

    color:#e5e7eb;

    word-break:break-word;
}


/* =====================================================
   OUTPUT BOX
===================================================== */

.output-box{
    background:#f8fafc;

    border:
        1px solid #e4e7ec;

    border-radius:12px;

    padding:15px;

    margin-bottom:12px;
}

.output-box h3{
    margin:0 0 10px;

    font-size:14px;
}

.output-text{
    white-space:pre-wrap;

    font-size:13px;

    line-height:1.65;

    color:#344054;

    min-height:30px;

    word-break:break-word;
}

.output-actions{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:12px;
}

.output-actions button{
    border:0;

    border-radius:9px;

    padding:9px 12px;

    background:#eef2f6;

    color:#101828;

    font-weight:700;

    font-size:12px;
}


/* =====================================================
   SOCIAL SECTION
===================================================== */

.social-section{
    background:#ffffff;

    border:
        1px solid #e4e7ec;

    border-radius:16px;

    padding:20px;

    margin-bottom:20px;
}

.social-section h2{
    margin:0 0 5px;

    font-size:18px;
}

.social-section > p{
    margin:0 0 16px;

    color:#667085;

    font-size:12px;
}

.social-grid{
    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:12px;
}

.social-card{
    border:0;

    border-radius:12px;

    padding:15px;

    min-height:75px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    color:#ffffff;

    font-weight:800;

    font-size:14px;

    transition:
        transform .15s,
        opacity .15s;
}

.social-card:hover{
    transform:translateY(-2px);
}

.social-card:active{
    transform:scale(.98);
}

.social-card span{
    font-size:20px;
}

.social-whatsapp{
    background:#16c965;
}

.social-facebook{
    background:#1877f2;
}

.social-instagram{
    background:
        linear-gradient(
            45deg,
            #f58529,
            #dd2a7b,
            #8134af
        );
}


/* =====================================================
   CANVA PREVIEW
===================================================== */

.canva-preview{
    background:#f4f6f9;

    border:
        1px solid #e4e7ec;

    border-radius:12px;

    padding:15px;

    overflow:hidden;

    display:flex;

    justify-content:center;

    align-items:center;
}

#mainCanvas{
    width:100%;

    max-width:900px;

    height:auto;

    display:block;

    background:#ffffff;

    box-shadow:
        0 8px 30px
        rgba(16,24,40,.12);
}


/* =====================================================
   MODAL
===================================================== */

.design-modal{
    position:fixed;

    inset:0;

    z-index:99999;

    background:
        rgba(15,23,42,.82);

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;
}

.design-modal.active{
    display:flex;
}

.design-modal-box{
    width:min(900px,100%);

    max-height:96vh;

    overflow:auto;

    background:#ffffff;

    border-radius:18px;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.4);
}

.design-modal-header{
    position:sticky;

    top:0;

    z-index:5;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:15px 18px;

    border-bottom:
        1px solid #eaecf0;
}

.design-modal-header h2{
    margin:0;

    font-size:17px;
}

.design-modal-header p{
    margin:4px 0 0;

    color:#667085;

    font-size:11px;
}

.close-modal{
    width:38px;
    height:38px;

    border:0;

    border-radius:9px;

    background:#f2f4f7;

    color:#344054;

    font-size:20px;
}

.canvas-area{
    background:#eef2f6;

    padding:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:auto;
}

#socialCanvas{
    display:block;

    width:auto;

    max-width:100%;

    height:auto;

    background:#ffffff;

    box-shadow:
        0 12px 35px
        rgba(16,24,40,.18);
}

.modal-actions{
    display:flex;

    flex-wrap:wrap;

    gap:9px;

    padding:15px 18px;
}

.modal-actions button{
    border:0;

    border-radius:9px;

    padding:11px 15px;

    font-size:12px;

    font-weight:800;
}

.download-png{
    background:#101828;
    color:#ffffff;
}

.download-jpg{
    background:#eef2f6;
    color:#101828;
}

.modal-canva{
    background:#7c3aed;
    color:#ffffff;
}


/* =====================================================
   SYSTEM MESSAGE
===================================================== */

#systemMessage{
    position:fixed;

    left:50%;

    bottom:25px;

    transform:translateX(-50%);

    z-index:100000;

    display:none;

    max-width:
        calc(100% - 30px);

    padding:12px 18px;

    border-radius:10px;

    background:#101828;

    color:#ffffff;

    font-size:13px;

    font-weight:700;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.25);

    text-align:center;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1100px){

    .main-grid{
        grid-template-columns:1fr;
    }

    .right-column{
        display:grid;

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:20px;
    }

    .right-column .card{
        margin-bottom:0;
    }

}


@media(max-width:750px){

    header{
        height:70px;

        padding:0 15px;
    }

    .header-logo{
        height:45px;

        max-width:170px;
    }

    .container{
        width:
            calc(100% - 20px);

        margin-top:18px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .photo-gallery{
        grid-template-columns:
            repeat(3,1fr);
    }

    .branding-box{
        grid-template-columns:1fr;
    }

    .brand-fields{
        grid-template-columns:1fr;
    }

    .brand-fields .full{
        grid-column:auto;
    }

    .right-column{
        display:block;
    }

    .social-grid{
        grid-template-columns:1fr;
    }

    .action-row{
        flex-direction:column;
    }

    .action-row .btn{
        width:100%;
    }

}


@media(max-width:450px){

    .card{
        padding:15px;
    }

    .page-heading h1{
        font-size:23px;
    }

    .photo-gallery{
        grid-template-columns:
            repeat(2,1fr);
    }

    .header-badge{
        display:none;
    }

}

</style>

</head>

"use strict";


/* =====================================================
   BASIC HELPERS
===================================================== */

function $(id){

    return document.getElementById(id);

}


function getValue(
    id,
    fallback = ""
){

    const element =
        $(id);

    if(!element){

        return fallback;

    }


    const result =
        element.value !== undefined
            ? element.value
            : element.textContent;


    return String(
        result || ""
    ).trim() || fallback;

}


function setText(
    id,
    text
){

    const element =
        $(id);


    if(element){

        element.textContent =
            text;

    }

}

   PHOTO VARIABLES
===================================================== */

let uploadedImages = [];


/* =====================================================
   PHOTO UPLOAD
===================================================== */

function handlePhotoUpload(){

    const input =
        $("propertyPhotos");


    if(!input){

        return;

    }


    uploadedImages =
        [];


    Array
        .from(input.files || [])
        .slice(0,12)
        .forEach(
            file => {

                if(
                    !file.type
                        .toLowerCase()
                        .startsWith("image/")
                ){

                    return;

                }


                const url =
                    URL.createObjectURL(
                        file
                    );


                uploadedImages.push(
                    url
                );

            }
        );


    renderPhotoGallery();

}


/* =====================================================
   PHOTO GALLERY
===================================================== */

function renderPhotoGallery(){

    const gallery =
        $("photoGallery");


    if(!gallery){

        return;

    }


    gallery.innerHTML =
        "";


    uploadedImages.forEach(
        (
            source,
            index
        ) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "photo-item";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                source;


            image.alt =
                "Property photo " +
                (index + 1);


            const remove =
                document.createElement(
                    "button"
                );


            remove.type =
                "button";


            remove.className =
                "photo-remove";


            remove.textContent =
                "×";


            remove.dataset.index =
                index;


            item.appendChild(
                image
            );


            item.appendChild(
                remove
            );


            gallery.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   REMOVE PHOTO
===================================================== */

function removePhoto(index){

    if(
        index < 0 ||
        index >= uploadedImages.length
    ){

        return;

    }


    const oldUrl =
        uploadedImages[index];


    if(
        oldUrl &&
        oldUrl.startsWith("blob:")
    ){

        URL.revokeObjectURL(
            oldUrl
        );

    }


    uploadedImages.splice(
        index,
        1
    );


    renderPhotoGallery();

}

<!-- =====================================================
     CANVAS HELPERS
===================================================== */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
){

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.arcTo(
        x + width,
        y,
        x + width,
        y + height,
        radius
    );

    ctx.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        radius
    );

    ctx.arcTo(
        x,
        y + height,
        x,
        y,
        radius
    );

    ctx.arcTo(
        x,
        y,
        x + width,
        y,
        radius
    );

    ctx.closePath();

}


function loadImage(src){

    return new Promise(
        resolve => {

            const img =
                new Image();

            img.onload =
                () => resolve(img);

            img.onerror =
                () => resolve(null);

            img.src =
                src;

        }
    );

}


function drawImageCover(
    ctx,
    img,
    x,
    y,
    width,
    height
){

    if(!img){

        return;

    }


    const scale =
        Math.max(
            width / img.width,
            height / img.height
        );


    const newWidth =
        img.width * scale;


    const newHeight =
        img.height * scale;


    const dx =
        x +
        (width - newWidth) / 2;


    const dy =
        y +
        (height - newHeight) / 2;


    ctx.save();


    ctx.beginPath();

    ctx.rect(
        x,
        y,
        width,
        height
    );

    ctx.clip();


    ctx.drawImage(
        img,
        dx,
        dy,
        newWidth,
        newHeight
    );


    ctx.restore();

}


/* =====================================================
   LOGO DRAWING
===================================================== */

async function drawLogo(
    ctx,
    x,
    y,
    width,
    height
){

    const logo =
        $("headerLogo");


    if(
        logo &&
        logo.complete &&
        logo.naturalWidth > 0
    ){

        const ratio =
            Math.min(
                width / logo.naturalWidth,
                height / logo.naturalHeight
            );


        const finalWidth =
            logo.naturalWidth * ratio;


        const finalHeight =
            logo.naturalHeight * ratio;


        const finalX =
            x +
            (width - finalWidth) / 2;


        const finalY =
            y +
            (height - finalHeight) / 2;


        ctx.drawImage(
            logo,
            finalX,
            finalY,
            finalWidth,
            finalHeight
        );


        return;

    }


    ctx.fillStyle =
        "#1681e8";


    ctx.font =
        "bold 42px Arial";


    ctx.fillText(
        "PropDeck",
        x,
        y + 45
    );

}

/* =====================================================
   DOWNLOAD CANVAS
===================================================== */

function downloadCanvas(
    canvas,
    filename,
    mimeType
){

    if(!canvas){

        showMessage(
            "Design is not available."
        );

        return;

    }


    try{

        const link =
            document.createElement(
                "a"
            );


        link.download =
            filename;


        link.href =
            canvas.toDataURL(
                mimeType,
                0.95
            );


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        showMessage(
            "Download started."
        );

    }

    catch(error){

        console.error(
            error
        );


        showMessage(
            "Download failed."
        );

    }

}

/* =====================================================
   COPY WHATSAPP
===================================================== */

async function copyWhatsApp(){

    const text =
        getValue(
            "whatsappOutput",
            ""
        );


    if(
        !text ||
        text === "—"
    ){

        showMessage(
            "Please generate content first."
        );

        return;

    }


    try{

        await navigator
            .clipboard
            .writeText(
                text
            );


        showMessage(
            "WhatsApp message copied!"
        );

    }

    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.left =
            "-9999px";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        try{

            document.execCommand(
                "copy"
            );

            showMessage(
                "WhatsApp message copied!"
            );

        }

        catch(copyError){

            showMessage(
                "Copy failed. Please copy manually."
            );

        }


        textarea.remove();

    }

}


/* =====================================================
   SHARE WHATSAPP
===================================================== */

function shareWhatsApp(){

    const text =
        getValue(
            "whatsappOutput",
            ""
        );


    if(
        !text ||
        text === "—"
    ){

        showMessage(
            "Please generate content first."
        );

        return;

    }


    const whatsappURL =
        "https://wa.me/?text=" +
        encodeURIComponent(
            text
        );


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* =====================================================
   BRAND LOGO UPLOAD
===================================================== */

function handleLogoUpload(
    event
){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file){

        return;

    }


    if(
        !file.type
            .toLowerCase()
            .startsWith("image/")
    ){

        showMessage(
            "Please select an image file."
        );

        return;

    }


    const url =
        URL.createObjectURL(
            file
        );


    const preview =
        $("brandingLogoPreview");


    const headerLogo =
        $("headerLogo");


    if(preview){

        preview.src =
            url;

    }


    if(headerLogo){

        headerLogo.src =
            url;

    }


    showMessage(
        "Company logo updated."
    );

}
